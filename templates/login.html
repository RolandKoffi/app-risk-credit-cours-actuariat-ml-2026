<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Risk Crédit</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --ink: #1a1a2e;
            --accent: #c0392b;
            --muted: #8a8275;
            --border: #d6cfc4;
            --radius: 4px;
        }

        html, body {
            height: 100%;
            font-family: 'DM Sans', sans-serif;
        }

        body {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
            background: #f5f0e8;
        }

        /* ── Image ── */
        .side-image {
            flex: 1 1 60%;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .side-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .side-image::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(26,26,46,0.4) 0%, transparent 60%);
        }

        .brand-overlay {
            position: absolute;
            bottom: 2rem; left: 2rem;
            color: #fff;
            z-index: 2;
        }

        .brand-overlay h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            line-height: 1.15;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        .brand-overlay p {
            font-size: 0.8rem;
            opacity: 0.85;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        /* ── Formulaire ── */
        .form-panel {
            flex: 0 0 600px;
            background: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2.5rem 2rem;
            box-shadow: -4px 0 40px rgba(0,0,0,0.08);
        }

        .form-panel h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            color: var(--ink);
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.83rem;
            color: var(--muted);
            margin-bottom: 1.8rem;
        }

        .field { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.35rem;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.93rem;
            color: var(--ink);
            background: #fafaf8;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--ink); background: #fff; }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.92rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.4rem;
            transition: background 0.2s;
        }

        .btn-primary:hover { background: var(--accent); }

        .alert-error {
            background: #fdf2f0;
            border-left: 3px solid var(--accent);
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius);
            font-size: 0.83rem;
            color: var(--accent);
            margin-bottom: 1.1rem;
        }

        .alert-success {
            background: #f0fdf4;
            border-left: 3px solid #27ae60;
            padding: 0.65rem 0.85rem;
            border-radius: var(--radius);
            font-size: 0.83rem;
            color: #27ae60;
            margin-bottom: 1.1rem;
        }

        .footer-link {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.83rem;
            color: var(--muted);
        }

        .footer-link a {
            color: var(--ink);
            font-weight: 500;
            text-decoration: none;
            border-bottom: 1px solid var(--ink);
        }

        /* ── Responsive ── */
        @media (max-width: 700px) {
            body { flex-direction: column; }

            .side-image {
                flex: 0 0 200px;
                width: 100%;
            }

            .brand-overlay { bottom: 1rem; left: 1.2rem; }
            .brand-overlay h1 { font-size: 1.5rem; }

            .form-panel {
                flex: 1 1 auto;
                width: 100%;
                max-width: 100%;
                box-shadow: none;
                padding: 2rem 1.4rem;
            }
        }

        @media (max-width: 380px) {
            .form-panel { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="side-image">
        <img src="{{ url_for('static', filename='img/img_login_credit.png') }}" alt="Visuel">
        <div class="brand-overlay">
            <h1>Risk Crédit<br>Analyser</h1>
            <p>Évaluation intelligente du risque</p>
        </div>
    </div>

    <div class="form-panel">
        <h2>Connexion</h2>
        <p class="subtitle">Accédez à votre espace d'analyse</p>

        {% if error %}
        <div class="alert-error">{{ error }}</div>
        {% endif %}
        {% if register_success %}
        <div class="alert-success">{{ register_success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" autocomplete="off" required>
            </div>
            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" autocomplete="off" required>
            </div>
            <button type="submit" class="btn-primary">Se connecter</button>
        </form>

        <p class="footer-link">
            Pas encore de compte ?
            <a href="{{ url_for('register') }}">Inscrivez-vous</a>
        </p>
    </div>
</body>
</html>
